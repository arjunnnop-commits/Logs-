name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q -o ./*.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJ_DIR=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FairyLogs-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
